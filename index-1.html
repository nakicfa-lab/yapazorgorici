<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://www.google.com https://www.recaptcha.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gstatic.com https://www.google.com; media-src 'self' blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com https://*.google.com https://www.gstatic.com https://www.recaptcha.net; frame-src https://*.firebaseapp.com https://www.google.com https://www.recaptcha.net https://accounts.google.com https://apis.google.com https://content.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer-when-downgrade">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yapazorgorici</title>
<!--@standalone-start-->
<meta name="theme-color" id="tc" content="#f2f5ee">
<meta name="description" content="Yapazorgorici, l’appli de vidéos courtes d’Abidjan : danse, cuisine, foot, code et vie de quartier.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!--@standalone-end-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: wordmark + rubriques on top, a vertical feed of framed video cards, floating pill nav. Light and dark themes. */
:root{
  --bg:#f2f5ee;
  --surface:#ffffff;
  --ink:#10241a;
  --muted:#52645a;
  --line:#d9e1d4;
  --accent:#c44900;
  --focus:#c44900;
  --leaf:#0b7a45;
  --sun:#ffc21a;
  --heart:#e11d48;
  --danger:#b3122f;
  --danger-fg:#ffffff;
  --nav-bg:#10241a;
  --chip-on-bg:#10241a;
  --chip-on-fg:#ffffff;
  --sticker-bg:#ffffff;
  --sticker-ink:#10241a;
  --toast-bg:#10241a;
  --toast-fg:#ffffff;
  --ph:#66766d;
  --f-display:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1510;--surface:#16231b;--ink:#e9f2ec;--muted:#a3b5a9;--line:#27392e;
    --focus:#ff8a3d;--danger:#ff7088;--danger-fg:#0c1510;--nav-bg:#1d2e24;
    --chip-on-bg:#e9f2ec;--chip-on-fg:#0c1510;--toast-bg:#e9f2ec;--toast-fg:#0c1510;--ph:#8aa093;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1510;--surface:#16231b;--ink:#e9f2ec;--muted:#a3b5a9;--line:#27392e;
  --focus:#ff8a3d;--danger:#ff7088;--danger-fg:#0c1510;--nav-bg:#1d2e24;
  --chip-on-bg:#e9f2ec;--chip-on-fg:#0c1510;--toast-bg:#e9f2ec;--toast-fg:#0c1510;--ph:#8aa093;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;overscroll-behavior:none}
/*@standalone-start*/
html{background:var(--bg)}
body{margin:0}
@supports (height:100dvh){html,body{height:100dvh}}
.app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/*@standalone-end*/
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.stage{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0}
.page{overflow-y:auto;padding:20px 16px 28px}
.page h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-bottom:16px}
.page h1:focus{outline:none}

/* Home: header */
#v-home{display:flex;flex-direction:column}
.top{flex:none;padding:8px 16px 4px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;background:var(--leaf);color:var(--sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.05rem;transform:rotate(-6deg)}
.word{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.03em;margin:0;flex:1;min-width:0}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none;position:relative}
.ib .ic{width:22px;height:22px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0 6px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button,.chips button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.85rem;font-weight:500;min-height:40px}
.cats button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--chip-on-bg);border-color:var(--chip-on-bg);color:var(--chip-on-fg)}

/* Deck */
.feed{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;overscroll-behavior-y:contain}
.feed::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;padding:2px 16px 6px;min-width:0}
.head{flex:none;display:flex;align-items:center;gap:4px;padding:4px 0 8px}
.head .av{margin-right:6px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.who b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:.78rem;color:var(--muted)}
.fol{border:1.5px solid var(--ink);border-radius:999px;padding:0 16px;min-height:40px;font-weight:700;font-size:.85rem;margin-left:4px}
.fol.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.card{flex:1;min-height:0;position:relative;border-radius:26px;overflow:hidden;background:#000;box-shadow:0 8px 0 var(--line)}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(8,16,12,.84),rgba(8,16,12,0) 48%)}
.count{position:absolute;top:12px;right:12px;background:rgba(16,36,26,.7);color:#fff;font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.title{position:absolute;left:16px;top:16%;max-width:82%;background:var(--sticker-bg);color:var(--sticker-ink);font-family:var(--f-display);font-weight:800;font-size:clamp(1.15rem,5vw,1.5rem);line-height:1.05;letter-spacing:-.02em;text-transform:uppercase;padding:9px 14px;border-radius:12px;transform:rotate(var(--rot,-3deg));box-shadow:0 5px 0 rgba(0,0,0,.22);pointer-events:none;overflow-wrap:anywhere}
.cmeta{position:absolute;left:16px;right:16px;bottom:16px;color:#fff;display:flex;flex-direction:column;gap:8px;min-width:0;pointer-events:none}
.cap{font-size:.95rem;overflow-wrap:anywhere}
.tag{font-weight:700;color:var(--sun)}
.sound{display:flex;align-items:center;gap:8px;overflow:hidden;font-size:.82rem;color:rgba(255,255,255,.9)}
.sound .ic{width:15px;height:15px;flex:none}
.mq{overflow:hidden;white-space:nowrap;min-width:0;flex:1}
.mq span{display:inline-block;animation:mq 12s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.pico{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:rgba(16,36,26,.65);display:grid;place-items:center;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s;pointer-events:none}
.pico .ic{width:32px;height:32px;fill:#fff;stroke:#fff}
.slide.paused .pico{opacity:1;transform:scale(1)}
.burst{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;z-index:5;animation:burst .8s ease-out forwards}
.burst .ic{width:100%;height:100%;fill:var(--heart);stroke:var(--heart)}
@keyframes burst{0%{transform:scale(.4) rotate(var(--r));opacity:0}20%{opacity:1;transform:scale(1.15) rotate(var(--r))}100%{transform:scale(1.6) translateY(-70px) rotate(var(--r));opacity:0}}

.acts{flex:none;display:flex;flex-wrap:wrap;gap:6px;padding-top:14px;justify-content:space-between}
.pill{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:44px;padding:0 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.pill .ic{width:20px;height:20px}
.pill.on{background:var(--heart);border-color:var(--heart);color:#fff}
.pill.on .ic{fill:currentColor}
.pill[data-act="save"].on{background:var(--sun);border-color:var(--sun);color:#10241a}
.pill.ico{padding:0}

.empty{flex:1;display:grid;place-content:center;gap:10px;text-align:center;padding:32px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.4rem}

.ic{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.av{display:grid;place-items:center;border-radius:50%;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;width:44px;height:44px;text-transform:uppercase}
.av.sm{width:38px;height:38px;font-size:.95rem}

/* Floating nav */
.nav{flex:none;display:flex;align-items:center;justify-content:space-around;height:60px;margin:6px 16px 10px;padding:0 8px;border-radius:30px;background:var(--nav-bg)}
.nav button{flex:1;display:grid;place-items:center;height:48px;color:rgba(255,255,255,.72);position:relative}
.nav button[aria-current="page"]{color:var(--sun)}
.nav .plus{flex:none;width:60px}
.plus i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff}
.plus .ic{width:22px;height:22px;stroke-width:2.8}
.badge{position:absolute;top:2px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--heart);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}

/* Forms */
label,.lab{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
label.sr{position:absolute;margin:0}
input[type="text"],input[type="search"],select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;min-height:46px}
input[type="file"]{width:100%;color:var(--muted);font-size:.85rem}
textarea{resize:vertical}
::placeholder{color:var(--ph);opacity:1}
.cta{display:block;width:100%;margin-top:22px;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;padding:14px;border-radius:14px;min-height:48px}
.cta.alt{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.cta.danger{background:var(--danger);color:var(--danger-fg)}
.cta.sm{margin-top:12px}
.scenes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scenes button{border-radius:14px;overflow:hidden;aspect-ratio:2/3;border:3px solid transparent}
.scenes button[aria-pressed="true"]{border-color:var(--accent)}
.scenes canvas{width:100%;height:100%;display:block}
.hint{font-size:.82rem;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:.85rem;margin-top:6px;font-weight:500}

/* Discover, profile */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.grid.three{grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;background:var(--line);text-align:left;display:block;width:100%;min-width:0}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .tt{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;background:linear-gradient(to top,rgba(8,16,12,.88),transparent);font-size:.78rem;display:flex;flex-direction:column;gap:2px;min-width:0;color:#fff}
.tile .tt b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tt span{color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
.none{color:var(--muted);padding:28px 0;text-align:center}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list li div{min-width:0}
.list small{display:block;color:var(--muted)}
.me{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.me .av{width:84px;height:84px;font-size:2rem}
.me h1{margin:6px 0 0}
.me .handle{color:var(--muted);overflow-wrap:anywhere}
.me #btn-settings{position:absolute;top:-8px;right:-8px}
.stats{display:flex;gap:28px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.78rem;color:var(--muted)}
.ptabs{display:flex;border-bottom:1px solid var(--line);margin-top:18px}
.ptabs button{flex:1;padding:12px 0;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;min-height:44px}
.ptabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}

/* Messages */
#inbox li{padding:0}
.conv{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;min-height:68px}
.conv .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.conv .ct b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv .pv{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.conv .pv.strong{color:var(--ink);font-weight:700}
.conv time{font-size:.75rem;color:var(--muted);flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--heart);flex:none}
#v-inbox.threadmode{overflow:hidden;padding-bottom:10px}
#thread{display:flex;flex-direction:column;height:100%;min-height:0}
.th-head{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.th-head h2{font-size:1.1rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 0}
.msg{max-width:82%;padding:10px 13px;border-radius:18px;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:4px}
.msg small{font-size:.7rem;opacity:.8}
.msg.me{align-self:flex-end;background:var(--leaf);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.them small{color:var(--muted);opacity:1}
.msg .see{align-self:flex-start;font-weight:700;text-decoration:underline;min-height:32px;color:inherit}
.typing{align-self:flex-start;color:var(--muted);font-size:.85rem;padding:2px 4px}
#th-form{padding:10px 0 0}

/* Sheet */
.backdrop{position:absolute;inset:0;background:rgba(8,16,12,.55);opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(100%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;z-index:21;border-top:1px solid var(--line)}
.open .backdrop{opacity:1;visibility:visible;transition:opacity .25s}
.open .sheet{transform:none;visibility:visible;transition:transform .28s ease}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px}
.sh-head h2{font-size:1.1rem;font-weight:800}
.sh-head button{width:44px;height:44px;display:grid;place-items:center;margin:-6px -6px -6px 0}
.sh-body{overflow-y:auto;padding:0 16px 16px;min-height:0}
.sh-body p{overflow-wrap:anywhere}
.sh-body p+p{margin-top:10px}
.sh-body ul.plain{margin:10px 0 0;padding-left:20px}
.sh-body ul.plain li{margin:4px 0}
.cm{display:flex;gap:10px;padding:10px 0;list-style:none}
.cm b{font-size:.85rem;color:var(--muted)}
.cm p{overflow-wrap:anywhere}
.cm small{color:var(--muted);font-size:.75rem}
.cm-list{margin:0;padding:0}
.cform{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.cform input{flex:1;min-width:0}
.cform button,.linkrow button{background:var(--accent);color:#fff;font-weight:700;border-radius:12px;padding:0 16px;min-height:46px}
.linkrow{display:flex;gap:8px}
.linkrow input{flex:1;min-width:0}
#th-form.cform{border-top:0}
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 4px;border-bottom:1px solid var(--line);text-align:left;font-weight:500}
.rowbtn.danger{color:var(--danger)}
.rowbtn small{color:var(--muted);font-weight:400}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:44px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;text-align:left;font-weight:500}
.sw i{width:48px;height:28px;border-radius:14px;background:var(--ph);position:relative;flex:none;transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--leaf)}
.sw[aria-checked="true"] i::after{transform:translateX(20px)}
.sec{margin-top:18px}
.sec:first-child{margin-top:0}
.pair{display:flex;gap:10px}
.pair .cta{margin-top:12px}
.toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-10px);background:var(--toast-bg);color:var(--toast-fg);font-weight:700;font-size:.85rem;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Auth */
.auth{position:absolute;inset:0;z-index:25;background:var(--bg);overflow-y:auto;padding:8px 20px 28px}
.auth-in{max-width:400px;margin:0 auto}
.auth h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;text-align:center}
.auth h1:focus{outline:none}
.auth .hint{text-align:center}
.authtop{display:flex;align-items:center;justify-content:space-between}
.authtop .mark{margin-right:11px}
.opts{margin-top:22px}
.opt{position:relative;display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-top:10px;padding:0 44px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700;text-align:center}
.opt .oi{position:absolute;left:16px;width:24px;height:24px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.switchbar{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:28px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.switchbar button{font-weight:700;color:var(--accent);min-height:44px;padding:0 6px}
.phone{display:flex;gap:8px}
.phone select{width:auto;flex:none}
.authnote{background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:.88rem}
.codebox{font-family:var(--f-display);font-size:1.7rem;letter-spacing:.3em;font-weight:800;margin-top:6px;text-align:center}
.linkbtn{display:block;margin:14px auto 0;font-weight:700;text-decoration:underline;min-height:44px;padding:0 12px}
.auth a{color:var(--ink);text-decoration:underline}
@media (prefers-reduced-motion:reduce){
  .mq span{animation:none}
  .sheet,.backdrop,.toast,.pico,.sw i,.sw i::after{transition:none}
  .burst{animation-duration:.01s}
}
</style>
</head>
<body>
<div class="app" id="app">
  <main class="stage" id="stage">
    <section class="view" id="v-home" aria-label="Accueil">
      <header class="top">
        <div class="brand">

const REPLIES = {

function pickReply(text, n) {
  const t = text.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');

  if (/\b(salut|bonjour|bonsoir|coucou|yo|akwaba|hello|cc)\b/.test(t)) k = 'hello';

  else if (t.includes('?')) k = 'ask';
  const a = REPLIES[k]; return a[n % a.length];
}

  const d = new Date(bd + 'T00:00:00'); if (!bd || isNaN(d) || d > new Date() || d.getFullYear() < 1900) return authFail('Entre une date de naissance valide.', '#a-bd');

async function sendSms(phone, btn, sel) {

async function doId(btn) {
  const m = am.method, raw = $('#a-id').value; am.err = '';

async function doPw(btn) {

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, updateProfile, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
const app = initializeApp({
  apiKey: "AIzaSyAp0vA9Rd9MvMNtdZVL2FbS4_RW4WarcnM",
  authDomain: "yapazorgorici.firebaseapp.com",
  projectId: "yapazorgorici",
  storageBucket: "yapazorgorici.firebasestorage.app",
  messagingSenderId: "345733691043",
  appId: "1:345733691043:web:4770f567140b58f59f3116"
});
const auth = getAuth(app); auth.languageCode = 'fr';
let verifier = null, conf = null;
window.FB = {
  auth, ready: auth.authStateReady(),
  async sendSms(phone) {
    if (verifier) { try { verifier.clear(); } catch (_) {} verifier = null; }
    const box = document.getElementById('recaptcha-box'); box.innerHTML = '';
    verifier = new RecaptchaVerifier(auth, box, { size: 'invisible' });
    try { conf = await signInWithPhoneNumber(auth, phone, verifier); }
    catch (e) { try { verifier.clear(); } catch (_) {} verifier = null; throw e; }
  },
  async confirmSms(code) { if (!conf) throw { code: 'auth/code-expired' }; return (await conf.confirm(code)).user; },
  async google() { return (await signInWithPopup(auth, new GoogleAuthProvider())).user; },
  async emailSignUp(email, pw, name) { const r = await createUserWithEmailAndPassword(auth, email, pw); await updateProfile(r.user, { displayName: name }); await sendEmailVerification(r.user); return r.user; },
  async emailLogin(email, pw) { return (await signInWithEmailAndPassword(auth, email, pw)).user; },
  async resendVerify() { await sendEmailVerification(auth.currentUser); },
  async reloadUser() { await auth.currentUser.reload(); return auth.currentUser; },
  async resetPw(email) { await sendPasswordResetEmail(auth, email); },
  async setName(n) { await updateProfile(auth.currentUser, { displayName: n }); },
  async signOut() { await signOut(auth); },
  async deleteAccount() { await deleteUser(auth.currentUser); }
};
dispatchEvent(new Event('fb-ready'));
</script>
</body>
</html>
